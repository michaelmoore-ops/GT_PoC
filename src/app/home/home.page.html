<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Blank </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <h2>Ready to create an app?</h2>
    <ion-item>
      <ion-label position="floating">Type something</ion-label>
      <ion-input [(ngModel)]="inputValue" placeholder="Start typing..."></ion-input>
    </ion-item>

    @if (inputValue) {
    <p>{{ inputValue }}</p>
    }

    <ion-button routerLink="/users" data-testid="users-link">View users</ion-button>
  </div>
</ion-content>
